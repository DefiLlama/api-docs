pre-commit:
  commands:
    schemas-types-generate:
      glob: 'packages/schemas/**/*'
      run: pnpm --filter @scalar/schemas types:generate:stage
      stage_fixed: true
    release-notes-schema-generate:
      glob: 'packages/release-notes/src/types.ts'
      run: pnpm --filter @scalar/release-notes schema:generate:stage
      stage_fixed: true
    biome:
      glob: '*.{js,ts,cjs,mjs,d.ts,d.cts,d.mts,jsx,tsx,json,jsonc,css,vue,svelte,astro}'
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.vue'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
